<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pink Hours">

<link rel="icon" href="icon.png">

<title>Hot Pink Hours</title>

<style>
/* Layout: phone-first app shell. Bottom tab bar on phones; top tabs + Now|Day side by side on wide screens. */
:root{
  --bg:#FFF1F7; --bg-dot:#FFDCEB; --surface:#FFFFFF; --surface-2:#FFE6F1; --ink:#3D0F2E; --ink-soft:#8E4F74; --line:#F5C9DD;
  --accent:#FF2E8A; --accent-soft:#FFD1E6; --on-accent:#FFFFFF;
  --productive:#FF2E8A; --maintenance:#A774FF; --recharge:#FF9466; --untracked:#E6C9D7;
  --ok:#14966C; --warn:#C8711C; --bad:#D6264F;
  --shadow:0 6px 18px rgba(214,38,120,.13);
  --font-display:"Shrikhand","Cooper Black",Georgia,serif;
  --font-body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A0914; --bg-dot:#260E1E; --surface:#2A0F22; --surface-2:#3A1530; --ink:#FFE6F2; --ink-soft:#D9A0C0; --line:#552141;
  --accent:#FF4D9D; --accent-soft:#5A1B40; --on-accent:#FFFFFF;
  --productive:#FF4D9D; --maintenance:#BE98FF; --recharge:#FFAA85; --untracked:#5E3A52;
  --ok:#4FD1A5; --warn:#F2A65A; --bad:#FF6B8B; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1A0914; --bg-dot:#260E1E; --surface:#2A0F22; --surface-2:#3A1530; --ink:#FFE6F2; --ink-soft:#D9A0C0; --line:#552141;
  --accent:#FF4D9D; --accent-soft:#5A1B40; --on-accent:#FFFFFF;
  --productive:#FF4D9D; --maintenance:#BE98FF; --recharge:#FFAA85; --untracked:#5E3A52;
  --ok:#4FD1A5; --warn:#F2A65A; --bad:#FF6B8B; --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.4;
  background-image:radial-gradient(var(--bg-dot) 1.6px, transparent 1.7px); background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:1240px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:14px 110px;}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.brand{font-family:var(--font-display); font-size:30px; line-height:1; color:var(--accent); letter-spacing:.3px; margin:0; text-shadow:2px 2px 0 var(--accent-soft)}
.brand small{display:block; font-family:var(--font-body); font-weight:800; font-size:12px; color:var(--ink-soft); letter-spacing:.12em; text-transform:uppercase; text-shadow:none; margin-top:6px}
.toptabs{display:none; gap:6px; background:var(--surface); padding:5px; border-radius:999px; border:1.5px solid var(--line)}
.tab{border:0; background:transparent; padding:8px 16px; border-radius:999px; font-weight:800; color:var(--ink-soft)}
.tab[aria-current="page"]{background:var(--accent); color:var(--on-accent)}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:space-around; background:var(--surface); border-top:1.5px solid var(--line);
  padding:6px max(10px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px));}
.tabbar .tab{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; padding:6px 10px; border-radius:14px; min-width:58px}
.tabbar .tab .ic{font-size:19px; line-height:1}

main{display:block}
.view{display:none; min-width:0}
main[data-tab="now"] #view-now, main[data-tab="day"] #view-day, main[data-tab="stats"] #view-stats, main[data-tab="projects"] #view-projects, main[data-tab="setup"] #view-setup{display:block}
@media (min-width: 960px){
  .toptabs{display:flex} .tabbar{display:none} .shell{padding-block:20px 40px}
  main[data-tab="now"]{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:22px; align-items:start}
  main[data-tab="now"] #view-day{display:block}
  .tab-day-btn{display:none}
}

h2.vt{font-family:var(--font-display); font-weight:400; font-size:24px; color:var(--accent); margin:0 0 10px; text-wrap:balance}
h3.st{font-size:12px; text-transform:uppercase; letter-spacing:.12em; font-weight:900; color:var(--ink-soft); margin:22px 0 10px; display:flex; align-items:center; gap:8px}
.dot{width:10px; height:10px; border-radius:50%; display:inline-block; flex:none}
.t-productive{--c:var(--productive)} .t-maintenance{--c:var(--maintenance)} .t-recharge{--c:var(--recharge)} .t-untracked{--c:var(--untracked)}
.dot{background:var(--c, var(--accent))}
.card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.spacer{flex:1}

/* buttons */
.btn{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-weight:800; font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad); border-color:var(--bad); background:transparent}
.btn.sm{padding:5px 11px; font-size:13px}
.icon-btn{border:0; background:var(--surface-2); width:36px; height:36px; border-radius:50%; font-weight:900; font-size:16px}

/* now card */
.now-card{position:relative; overflow:hidden; border-radius:24px; padding:18px; background:var(--surface); border:2px solid var(--c, var(--line)); box-shadow:var(--shadow)}
.now-card::before{content:""; position:absolute; inset:0; background:var(--c, var(--accent)); opacity:.09; pointer-events:none}
.now-card > *{position:relative}
.eyebrow{font-size:11px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; color:var(--c, var(--ink-soft))}
.now-main{display:flex; align-items:center; gap:14px; margin-top:6px}
.now-emoji{font-size:44px; line-height:1; width:64px; height:64px; display:grid; place-items:center; border-radius:20px; background:var(--surface); border:1.5px solid var(--line); flex:none}
.now-name{font-size:24px; font-weight:900; margin:0; line-height:1.15; text-wrap:balance}
.now-timer{font-size:40px; font-weight:900; letter-spacing:-.5px; color:var(--c); margin-top:8px; line-height:1}
.linkish{border:0; background:none; padding:0; color:var(--ink-soft); font-weight:700; text-decoration:underline dotted; text-underline-offset:3px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--surface-2); font-weight:800; font-size:13px}
.while{margin-top:14px; padding-top:12px; border-top:1.5px dashed var(--line)}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px}
.wchip{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 12px; font-weight:800; font-size:14px}
.wchip[aria-pressed="true"]{background:var(--c, var(--accent)); border-color:var(--c, var(--accent)); color:var(--on-accent)}
textarea.note{width:100%; margin-top:12px; min-height:58px; resize:vertical; border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--surface)}
.upnext{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.planned{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:16px; border:2px dashed var(--c); background:var(--surface)}
.planned .grow{flex:1; min-width:0}

/* activity grid */
.grid{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:9px}
@media (min-width:600px){ .grid{grid-template-columns:repeat(4, minmax(0,1fr))} }
.act{position:relative; border:1.5px solid var(--line); background:var(--surface); border-radius:18px; padding:12px 6px 10px; display:flex; flex-direction:column; align-items:center; gap:5px;
  font-weight:800; font-size:13px; line-height:1.15; text-align:center; min-height:84px; justify-content:center;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; transition:transform .12s ease}
.act .em{font-size:28px; line-height:1}
.act:active{transform:scale(.96)}
.act.on{background:var(--c); border-color:var(--c); color:var(--on-accent); box-shadow:0 6px 16px color-mix(in srgb, var(--c) 40%, transparent)}
.act.soon{border:2px dashed var(--c)}
.act.add{border:2px dashed var(--line); background:transparent; color:var(--ink-soft)}
.act.add .em{color:var(--c); font-weight:900}
.act.add:hover{border-color:var(--c)}
.badge{position:absolute; top:-7px; right:-4px; background:var(--c); color:var(--on-accent); font-size:10.5px; font-weight:900; padding:2px 7px; border-radius:999px}
.act.on .badge{background:var(--surface); color:var(--c)}
.hint{font-size:12.5px; color:var(--ink-soft); margin-top:12px; text-align:center}

/* day timeline */
.daynav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.daynav .title{font-weight:900; font-size:18px; min-width:0}
.sumchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.tl-wrap{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:10px 10px 10px 0; box-shadow:var(--shadow); max-height:72vh; overflow-y:auto; position:relative}
.tl{position:relative; margin-left:52px}
.hr{position:absolute; left:-52px; right:0; border-top:1px solid var(--line); font-size:11px; font-weight:800; color:var(--ink-soft)}
.hr span{position:absolute; left:6px; top:-8px; background:var(--surface); padding:0 4px}
.lane-main{position:absolute; top:0; bottom:0; left:4px; right:34%}
.lane-sub{position:absolute; top:0; bottom:0; right:4px; width:calc(34% - 10px)}
.blk{position:absolute; left:0; right:0; border-radius:10px; padding:3px 8px; overflow:hidden; text-align:left; border:0; font-size:12.5px; line-height:1.2;
  background:color-mix(in srgb, var(--c) 22%, var(--surface)); border-left:4px solid var(--c); color:var(--ink)}
.blk b{font-weight:900}
.blk .t{color:var(--ink-soft); font-weight:700; font-size:11.5px}
.blk.run{background:color-mix(in srgb, var(--c) 34%, var(--surface))}
.blk.sub{border-left-style:dotted}
.plan-ghost{position:absolute; left:0; right:0; border:2px dashed var(--c); border-radius:10px; opacity:.75; pointer-events:none}
.plan-ghost span{position:absolute; right:6px; bottom:3px; font-size:10.5px; font-weight:900; color:var(--c); background:var(--surface); padding:0 4px; border-radius:6px}
.gap{position:absolute; left:0; right:0; border-radius:10px; border:0; padding:0 8px; text-align:left; font-size:11.5px; font-weight:800; color:var(--ink-soft);
  background:repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--untracked) 70%, transparent) 6px 12px)}
.nowline{position:absolute; left:-6px; right:0; height:0; border-top:2.5px solid var(--accent); z-index:3; pointer-events:none}
.nowline::before{content:""; position:absolute; left:-4px; top:-6.5px; width:10px; height:10px; border-radius:50%; background:var(--accent)}

/* stats */
.kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (min-width:700px){ .kpis{grid-template-columns:repeat(5,minmax(0,1fr))} }
.kpi{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:12px 14px}
.kpi .v{font-size:26px; font-weight:900; line-height:1.1}
.kpi .l{font-size:11.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em}
.two{display:grid; grid-template-columns:minmax(0,1fr); gap:16px}
@media (min-width:900px){ .two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.bars{display:flex; flex-direction:column; gap:7px}
.bar{display:grid; grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 4.2em; gap:8px; align-items:center; font-size:13.5px; font-weight:700}
.bar .lab{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar .trk{height:12px; border-radius:999px; background:var(--surface-2); overflow:hidden}
.bar .fill{height:100%; border-radius:999px; background:var(--c)}
.bar .v{text-align:right; font-variant-numeric:tabular-nums}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; font-weight:800; color:var(--ink-soft); margin-top:8px}
.legend span{display:inline-flex; align-items:center; gap:5px}
svg text{fill:var(--ink-soft); font-family:var(--font-body); font-weight:800; font-size:11px}
svg .gridl{stroke:var(--line); stroke-width:1}
.f-productive{fill:var(--productive)} .f-maintenance{fill:var(--maintenance)} .f-recharge{fill:var(--recharge)} .f-untracked{fill:var(--untracked)} .f-empty{fill:var(--surface-2)}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); padding:6px 6px; border-bottom:1.5px solid var(--line)}
.tbl td{padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right; font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.pill{display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:900; white-space:nowrap}
.pill.ok{background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok)}
.pill.warn{background:color-mix(in srgb, var(--warn) 20%, transparent); color:var(--warn)}
.pill.bad{background:color-mix(in srgb, var(--bad) 18%, transparent); color:var(--bad)}
.pill.soft{background:var(--surface-2); color:var(--ink-soft)}
.heat{display:grid; grid-template-columns:3em repeat(24, minmax(14px,1fr)); gap:2px; font-size:10.5px; font-weight:800; color:var(--ink-soft); min-width:420px}
.heat .c{aspect-ratio:1; border-radius:4px; background:var(--surface-2)}
.heat .c i{display:block; width:100%; height:100%; border-radius:4px; background:var(--productive)}

/* projects/setup */
.list{display:flex; flex-direction:column; gap:8px}
.item{display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px}
.item .grow{flex:1; min-width:0}
.item.done .task{text-decoration:line-through; color:var(--ink-soft)}
.check{width:26px; height:26px; border-radius:9px; border:2px solid var(--accent); background:transparent; display:grid; place-items:center; flex:none; font-weight:900; color:var(--on-accent)}
.check[aria-checked="true"]{background:var(--accent)}
input.in, select.in{border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 10px; min-width:0}
input.in.em{width:3.2em; text-align:center; font-size:18px; padding:5px}
.form{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.form .in.grow{flex:1 1 180px}
.setrow{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px}
.setrow .in.name{flex:1 1 140px}
.tog{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:800}
.tog[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.daychips{display:flex; gap:3px}
.daychips .tog{padding:4px 7px; min-width:30px}
.archived{opacity:.55}
details.fold > summary{cursor:pointer; font-weight:800; color:var(--ink-soft); padding:6px 0}

/* sheet */
.backdrop{position:fixed; inset:0; z-index:40; background:color-mix(in srgb, var(--ink) 40%, transparent); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:26px 26px 0 0; border:2px solid var(--line);
  padding:18px max(18px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px));}
@media (min-width:700px){ .backdrop{align-items:center} .sheet{border-radius:26px} }
.sheet h3{font-family:var(--font-display); font-weight:400; color:var(--accent); font-size:22px; margin:0 0 12px}
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.opt{border:1.5px solid var(--line); background:var(--surface-2); border-radius:14px; padding:12px; font-weight:800; text-align:left}
.opt:hover{border-color:var(--accent)}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px}
.field label{font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft)}
.field .in{width:100%}
.warnline{color:var(--warn); font-weight:800; font-size:13px; margin:4px 0 8px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--ink); color:var(--bg);
  padding:10px 16px; border-radius:999px; font-weight:800; font-size:14px; box-shadow:var(--shadow); max-width:calc(100% - 32px)}
@media (min-width:960px){ .toast{bottom:28px} }
.empty{text-align:center; padding:28px 16px}
.empty .big{font-family:var(--font-display); color:var(--accent); font-size:26px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="shell">
  <header class="top">
    <h1 class="brand">hot pink hours<small id="todayline">&nbsp;</small></h1>
    <nav class="toptabs" aria-label="Sections">
      <button class="tab" data-go="now">Now</button>
      <button class="tab tab-day-btn" data-go="day">Day</button>
      <button class="tab" data-go="stats">Dashboard</button>
      <button class="tab" data-go="projects">Projects</button>
      <button class="tab" data-go="setup">Setup</button>
    </nav>
  </header>
  <main id="main" data-tab="now">
    <section class="view" id="view-now"></section>
    <section class="view" id="view-day"></section>
    <section class="view" id="view-stats"></section>
    <section class="view" id="view-projects"></section>
    <section class="view" id="view-setup"></section>
  </main>
</div>
<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-go="now"><span class="ic">💗</span>Now</button>
  <button class="tab" data-go="day"><span class="ic">🗓️</span>Day</button>
  <button class="tab" data-go="stats"><span class="ic">📊</span>Stats</button>
  <button class="tab" data-go="projects"><span class="ic">🎀</span>Projects</button>
  <button class="tab" data-go="setup"><span class="ic">⚙️</span>Setup</button>
</nav>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
/* ============ YOUR SUPABASE PROJECT ============

   anon / publishable key. The key is safe to be public: Row Level Security protects your rows. */
const SUPABASE_URL = "https://zmgwwjsanyxmlnldafgb.supabase.co/rest/v1/";

const p2 = n => String(n).padStart(2,"0");

const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
const mondayOf = ms => { const d = new Date(dayStart(ms)); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getTime(); };
const dowOf = ms => ((new Date(ms).getDay()+6)%7)+1;
const atHM = (hmStr, base) => { const [h,m] = hmStr.split(":").map(Number); const d = new Date(base); d.setHours(h,m,0,0); return d.getTime(); };
const fmtT = ms => new Date(ms).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const fmtDate = (ms, o) => new Date(ms).toLocaleDateString([], o || {weekday:"short", month:"short", day:"numeric"});
const fmtDur = mins => { mins = Math.round(mins); if (mins < 1) return "0m"; const h = Math.floor(mins/60), m = mins%60; return h ? (m ? h+"h "+m+"m" : h+"h") : m+"m"; };

const fmtClock = ms => { const s = Math.max(0, Math.floor(ms/1000)); return Math.floor(s/3600)+":"+p2(Math.floor(s/60)%60)+":"+p2(s%60); };
const toLocalInput = ms => { const d = new Date(ms); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+"T"+p2(d.getHours())+":"+p2(d.getMinutes()); };
const fromLocalInput = v => { if (!v) return null; const t = new Date(v).getTime(); return isNaN(t) ? null : t; };

function switchMain(actId, t, extra){
  extra = extra || {}; const now = Date.now(); t = Math.min(t == null ? now : t, now);
  const ch = {}; const get = k => ch[k] || (ch[k] = dayData(k));

    if (t < run.start) t = run.start;
    const d = get(run._day); const i = d.entries.findIndex(x => x.id === run.id);
    if (i >= 0){ if (t - run.start < MIN && !(run.note||"").trim()) d.entries.splice(i,1); else d.entries[i].end = t; }
  }
  closeSub(get, t);
  get(keyOf(t)).entries.push({id:uid(), act:actId, start:t, end:null, label:extra.label||"", project:extra.project||"", note:""});
  commitDays(ch);
  const a = actById(actId); toast(a.emoji+" "+a.name+(t < now - MIN ? " since "+fmtT(t) : " started"));
}
function closeSub(get, t){
  const s = runningSub(); if (!s) return;
  const d = get(s._day); const i = d.subs.findIndex(x => x.id === s.id);
  if (i < 0) return;
  if (t - s.start < MIN) d.subs.splice(i,1); else d.subs[i].end = Math.max(t, s.start);
}
function switchSub(subId, t, project){
  const run = runningMain(); if (!run) return;
  const now = Date.now(); t = Math.max(Math.min(t == null ? now : t, now), run.start);

  closeSub(get, t);

}
function stopAll(){

/* ---------- planned ---------- */
function plannedBetween(a, b){
  const out = []; const c = cfg();
  for (let d = dayStart(a); d < b; d = addDays(d,1)){
    const k = keyOf(d), w = dowOf(d);
    for (const s of (c.schedule||[])){
      if (!(s.days||[]).includes(w)) continue;
      if (s.from && k < s.from) continue; if (s.until && k > s.until) continue;
      if (!s.start || !s.end) continue;
      let st = atHM(s.start, d), en = atHM(s.end, d); if (en <= st) en = addDays(en,1);
      if (en > a && st < b) out.push({id:s.id+"@"+k, label:s.label, act:s.act, s:st, e:en});
    }
    for (const o of (c.oneoffs||[])){
      if (o.date !== k || !o.start || !o.end) continue;
      let st = atHM(o.start, d), en = atHM(o.end, d); if (en <= st) en = addDays(en,1);
      if (en > a && st < b) out.push({id:o.id, label:o.label, act:o.act, s:st, e:en});
    }
  }
  return out.sort((x,y)=>x.s-y.s);
}
function plannedStatus(p){
  const now = Date.now();
  const hits = allMain().filter(e => e.act === p.act && overlap(e.start, endOf(e), p.s, p.e) > 0);
  if (!hits.length){ if (now < p.s) return {k:"upcoming"}; if (now < p.e) return {k:"pending"}; return {k:"skipped"}; }
  const first = Math.min(...hits.map(e=>e.start)), last = Math.max(...hits.map(endOf));
  const late = (first - p.s)/MIN, early = (p.e - last)/MIN;
  const attended = hits.reduce((t,e)=>t+overlap(e.start, endOf(e), p.s, p.e), 0)/MIN;
  if (late > 3) return {k:"late", late, early: now >= p.e && early > 3 ? early : 0, attended};
  if (now >= p.e && early > 3) return {k:"early", early, attended};
  return {k:"ontime", attended};
}

/* ---------- stats ---------- */
function computeRange(a, b){
  const now = Date.now(); const mains = allMain(); const subs = allSubs();
  const firstEver = mains.length ? mains[0].start : null;
  const r = {byType:{productive:0,maintenance:0,recharge:0}, byAct:{}, tracked:0, untracked:0, reclaimed:0, reclaimBy:{}, exercise:0, perDay:[]};
  for (const e of mains){
    const m = overlap(e.start, endOf(e), a, b)/MIN; if (!m) continue;
    const t = actById(e.act).type; r.byType[t] = (r.byType[t]||0)+m; r.byAct[e.act] = (r.byAct[e.act]||0)+m; r.tracked += m;
    if (actById(e.act).exercise) r.exercise += m;
  }
  for (const s of subs){
    const m = overlap(s.start, endOf(s), a, b)/MIN; if (!m) continue;
    const so = subById(s.sub);
    if (so.reclaim){ r.reclaimed += m; r.reclaimBy[s.sub] = (r.reclaimBy[s.sub]||0)+m; }
    if (so.exercise) r.exercise += m;
  }
  for (let d = a; d < b; d = addDays(d,1)){
    const de = addDays(d,1); const day = {start:d, byType:{productive:0,maintenance:0,recharge:0}, untracked:0, open:0};
    for (const e of mains){ const m = overlap(e.start, endOf(e), d, de)/MIN; if (m) day.byType[actById(e.act).type] += m; }
    if (firstEver != null){
      const ws = Math.max(d, firstEver), we = Math.min(de, now);
      if (we > ws){ let tr = 0; for (const e of mains) tr += overlap(e.start, endOf(e), ws, we); day.untracked = Math.max(0, (we-ws-tr)/MIN); }
    }
    r.untracked += day.untracked; r.perDay.push(day);
  }
  return r;
}
function sleepStats(a, b){
  const nights = allMain().filter(e => e.act === "sleep" && e.end != null && e.start >= a && e.start < b && (e.end-e.start) >= 3*HOUR);
  if (!nights.length) return null;
  const avg = nights.reduce((t,e)=>t+(e.end-e.start),0)/nights.length/MIN;
  const toNoonMin = ms => { const d = new Date(ms); return (d.getHours()*60+d.getMinutes()-720+1440)%1440; };
  const toMidMin = ms => { const d = new Date(ms); return d.getHours()*60+d.getMinutes(); };
  const bed = nights.reduce((t,e)=>t+toNoonMin(e.start),0)/nights.length;
  const wake = nights.reduce((t,e)=>t+toMidMin(e.end),0)/nights.length;
  const clockStr = mins => { const d = new Date(2000,0,1,0,0); d.setMinutes(Math.round(mins)); return fmtT(d.getTime()); };
  return {n:nights.length, avg, bed:clockStr((bed+720)%1440), wake:clockStr(wake)};
}

    root => { const chk = () => { const s = fromLocalInput($("ed-start").value), en = fromLocalInput($("ed-end").value) ?? (running ? Date.now() : null); let w = "";
        if (s != null && en != null && en <= s) w = "End needs to be after start.";
        else if (!isSub && s != null && en != null){ const o = allMain().find(x => x.id !== id && overlap(x.start, endOf(x), s, en) > MIN); if (o) w = "Overlaps "+actById(o.act).name+" ("+fmtT(o.start)+"–"+(o.end==null?"now":fmtT(o.end))+"). Saving will trim it."; }
        $("ed-warn").textContent = w; };
      root.addEventListener("input", chk); chk(); });
  S.editing = {kind, id, running};

function saveEdit(){
  const {kind, id, running} = S.editing; const isSub = kind === "sub";
  const what = $("ed-what").value; if (!what){ $("ed-warn").textContent = "Choose an activity."; return; }
  const s = fromLocalInput($("ed-start").value); let en = fromLocalInput($("ed-end").value);
  if (s == null){ $("ed-warn").textContent = "Add a start time."; return; }
  if (en == null && !running){ $("ed-warn").textContent = "Add an end time."; return; }
  if (en != null && en <= s){ $("ed-warn").textContent = "End needs to be after start."; return; }
  if (s > Date.now()){ $("ed-warn").textContent = "Start can't be in the future."; return; }
  const ch = {}; const get = k => ch[k] || (ch[k] = dayData(k)); const list = isSub ? "subs" : "entries";
  let old = null;
  if (id){ const src = (isSub ? allSubs() : allMain()).find(x => x.id === id); if (src){ const d = get(src._day); const i = d[list].findIndex(x => x.id === id); if (i >= 0) old = d[list].splice(i,1)[0]; } }
  const rec = Object.assign({}, old || {id:uid(), note:""}, {start:s, end:en, project:$("ed-proj").value});
  if (isSub) rec.sub = what; else { rec.act = what; rec.label = $("ed-label").value.trim(); rec.note = $("ed-note").value; }
  if (isSub && !rec.parent){ const par = allMain().find(m => m.start <= s && s < endOf(m)); rec.parent = par ? par.id : ""; }
  if (!isSub){ // trim overlapping neighbours so totals stay honest
    const eEnd = en == null ? Date.now() : en;
    for (const o of allMain()){ if (o.id === id || overlap(o.start, endOf(o), s, eEnd) <= 0) continue;
      const d = get(o._day); const i = d.entries.findIndex(x => x.id === o.id); if (i < 0) continue; const x = d.entries[i];
      if (o.start >= s && endOf(o) <= eEnd && o.end != null) d.entries.splice(i,1);
      else if (o.start < s) { if (x.end == null || endOf(o) > s) x.end = s; }
      else x.start = eEnd;
    }
  }
  get(keyOf(s))[list].push(rec);
  closeSheet(); commitDays(ch); toast("Saved");
}
function deleteEdit(){
  const {kind, id} = S.editing; const isSub = kind === "sub"; const src = (isSub ? allSubs() : allMain()).find(x => x.id === id); if (!src) return closeSheet();
  const d = dayData(src._day); const list = isSub ? "subs" : "entries"; d[list] = d[list].filter(x => x.id !== id); closeSheet(); commitDays({[src._day]:d}); toast("Deleted");
}

/* ---------- export ---------- */
async function exportCsv(){
  const q = v => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows = [["kind","date","activity","type","label","project","start","end","minutes","note","inside"]];
  for (const e of allMain()){ const a = actById(e.act); rows.push(["main", keyOf(e.start), a.name, a.type, e.label, projName(e.project), new Date(e.start).toISOString(), e.end ? new Date(e.end).toISOString() : "", Math.round((endOf(e)-e.start)/MIN), e.note, ""]); }
  for (const s of allSubs()){ const so = subById(s.sub); const par = allMain().find(m => m.id === s.parent); rows.push(["while", keyOf(s.start), so.name, so.reclaim ? "reclaimed" : "", "", projName(s.project), new Date(s.start).toISOString(), s.end ? new Date(s.end).toISOString() : "", Math.round((endOf(s)-s.start)/MIN), "", par ? actById(par.act).name : ""]); }
  const csv = rows.map(r => r.map(q).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"}); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "hot-pink-hours-"+keyOf(Date.now())+".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function parseCsv(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){ const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ","){ row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += ch; }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.length > 1);
}
function importCsv(text){
  const rows = parseCsv(text); const hdr = rows.shift() || []; const ix = n => hdr.indexOf(n);
  if (ix("kind") < 0 || ix("start") < 0){ toast("That file doesn't look like a Hot Pink Hours export."); return; }
  const c = clone(cfg()); let cfgChanged = false;
  const find = (list, name) => list.find(x => x.name.toLowerCase() === String(name).trim().toLowerCase());
  const projId = name => { if (!name) return ""; let p = find(c.projects, name); if (!p){ p = {id:"j"+uid(), name, archived:false}; c.projects.push(p); cfgChanged = true; } return p.id; };
  const ch = {}; const get = k => ch[k] || (ch[k] = dayData(k));
  const seen = new Set(allMain().map(e => e.act+"@"+e.start).concat(allSubs().map(s => s.sub+"@"+s.start)));
  let nMain = 0, nSub = 0; const mains = [];
  for (const r of rows){ if (r[ix("kind")] !== "main") continue;
    const st = Date.parse(r[ix("start")]); if (isNaN(st)) continue; const en = r[ix("end")] ? Date.parse(r[ix("end")]) : null;
    let a = find(c.activities, r[ix("activity")]);
    if (!a){ const ty = TYPES.some(t => t[0] === r[ix("type")]) ? r[ix("type")] : "maintenance"; a = {id:"a"+uid(), name:r[ix("activity")], emoji:"⭐", type:ty, whiles:[], project:false, exercise:false, archived:false}; c.activities.push(a); cfgChanged = true; }
    const e = {id:uid(), act:a.id, start:st, end:en, label:r[ix("label")]||"", project:projId(r[ix("project")]), note:r[ix("note")]||""};
    mains.push(e); if (seen.has(a.id+"@"+st)) continue; seen.add(a.id+"@"+st);
    get(keyOf(st)).entries.push(e); nMain++; }
  const pool = allMain().concat(mains);
  for (const r of rows){ if (r[ix("kind")] !== "while") continue;
    const st = Date.parse(r[ix("start")]); if (isNaN(st)) continue; const en = r[ix("end")] ? Date.parse(r[ix("end")]) : null;
    let s = find(c.subs, r[ix("activity")]);
    if (!s){ s = {id:"s"+uid(), name:r[ix("activity")], emoji:"✨", reclaim:r[ix("type")] === "reclaimed", exercise:false, project:false, archived:false}; c.subs.push(s); cfgChanged = true; }
    if (seen.has(s.id+"@"+st)) continue; seen.add(s.id+"@"+st);
    const par = pool.find(m => m.start <= st && st < (m.end == null ? Date.now() : m.end));
    get(keyOf(st)).subs.push({id:uid(), sub:s.id, start:st, end:en, project:projId(r[ix("project")]), parent:par ? par.id : ""}); nSub++; }
  if (cfgChanged){ S.config = c; persistMany([["config","main",c]]); }
  commitDays(ch);
  toast("Imported "+nMain+" entries and "+nSub+' "while" entries');
}

/* ---------- events ---------- */
let pressTimer = null, suppressClick = false;
document.addEventListener("pointerdown", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  suppressClick = false; clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { suppressClick = true; if (navigator.vibrate) try { navigator.vibrate(15); } catch(_){} backdateSheet(b.dataset.act); }, 480);
});
["pointerup","pointercancel","pointerleave"].forEach(t => document.addEventListener(t, () => clearTimeout(pressTimer), true));
document.addEventListener("contextmenu", ev => { if (ev.target.closest("[data-act]")) ev.preventDefault(); });

document.addEventListener("click", ev => {
  const t = ev.target; const c = sel => t.closest(sel);
  let el;
  if ((el = c("[data-go]"))){ S.tab = el.dataset.go; S.scrolledFor = null; render(); window.scrollTo(0,0); return; }
  if (t.matches("[data-close-bd]") || c("[data-close]")){ closeSheet(); return; }
  if ((el = c("[data-act]"))){ if (suppressClick){ suppressClick = false; return; } const run = runningMain(); const a = actById(el.dataset.act);
    if (run && run.act === el.dataset.act && !a.project){ toast("Already on "+a.name); return; } startFlow(el.dataset.act, null); return; }
  if ((el = c("[data-new-act]"))){ newActSheet(el.dataset.newAct); return; }
  if ((el = c("[data-na-emoji]"))){ $("na-emoji").value = el.dataset.naEmoji; return; }
  if (c("[data-na-tog]")){ const b = $("na-proj"); b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); return; }
  if (c("[data-na-save]")){ saveNewAct(); return; }
  if ((el = c("[data-bd]"))){ const t0 = Date.now() - Number(el.dataset.bd)*MIN; startFlow(S.pendingAct, t0); return; }
  if (c("[data-bd-custom]")){ const v = $("bd-time").value; if (!v) return; let t0 = atHM(v, Date.now()); if (t0 > Date.now()) t0 = addDays(t0,-1); startFlow(S.pendingAct, t0); return; }
  if ((el = c("[data-pick]"))){ const cb = S.pickCb; S.pickCb = null; if (cb) cb(el.dataset.pick); return; }
  if ((el = c("[data-start-planned]"))){ const [act, label] = el.dataset.startPlanned.split("|"); startFlow(act, null, label); return; }
  if ((el = c("[data-sub]"))){ const sid = el.dataset.sub; const cur = runningSub();
    if (cur && cur.sub === sid){ switchSub(null); return; }
    const so = subById(sid); if (so.project) projectSheet(so.emoji+" "+so.name+": which project?", pid => { closeSheet(); switchSub(sid, null, pid); }); else switchSub(sid); return; }
  if (c("[data-act-stop]")){ stopAll(); return; }
  if ((el = c("[data-edit]"))){ const [k, id] = el.dataset.edit.split(":"); editSheet(k, id); return; }
  if ((el = c("[data-fill]"))){ const [s, e] = el.dataset.fill.split("|").map(Number); editSheet("main", null, {start:s, end:e}); return; }
  if (c("[data-add-entry]")){ const d0 = S.dayView != null ? S.dayView : dayStart(Date.now()); const base = Math.min(Date.now(), d0 + 12*HOUR); editSheet("main", null, {start:base-HOUR, end:base}); return; }
  if (c("[data-ed-save]")){ saveEdit(); return; }
  if (c("[data-ed-del]")){ const b = c("[data-ed-del]"); if (b.dataset.armed){ deleteEdit(); } else { b.dataset.armed = "1"; b.textContent = "Tap again to delete"; } return; }
  if ((el = c("[data-day-nav]"))){ const n = Number(el.dataset.dayNav); const cur = S.dayView != null ? S.dayView : dayStart(Date.now()); S.dayView = n === 0 ? null : addDays(cur, n); if (S.dayView === dayStart(Date.now())) S.dayView = null; render(); return; }
  if ((el = c("[data-week-nav]"))){ const n = Number(el.dataset.weekNav); const cur = S.week != null ? S.week : mondayOf(Date.now()); S.week = n === 0 ? null : addDays(cur, 7*n); render(); return; }
  if ((el = c("[data-due-toggle]"))){ const id = el.dataset.dueToggle; writeDue(d => { const x = d.items.find(i => i.id === id); if (x){ x.done = !x.done; x.doneAt = x.done ? Date.now() : null; } }); return; }
  if ((el = c("[data-due-del]"))){ if (el.dataset.armed){ const id = el.dataset.dueDel; writeDue(d => { d.items = d.items.filter(i => i.id !== id); }); } else { el.dataset.armed = "1"; el.textContent = "Delete?"; } return; }
  if ((el = c("[data-proj-archive]"))){ const id = el.dataset.projArchive; writeConfig(cf => { cf.projects.find(p => p.id === id).archived = true; }); return; }
  if ((el = c("[data-proj-restore]"))){ const id = el.dataset.projRestore; writeConfig(cf => { cf.projects.find(p => p.id === id).archived = false; }); return; }
  if ((el = c("[data-act-tog]"))){ const [id, f] = el.dataset.actTog.split("|"); writeConfig(cf => { const a = cf.activities.find(a => a.id === id); a[f] = !a[f]; }); return; }
  if ((el = c("[data-act-while]"))){ const [id, sid] = el.dataset.actWhile.split("|"); writeConfig(cf => { const a = cf.activities.find(a => a.id === id); a.whiles = a.whiles || []; a.whiles = a.whiles.includes(sid) ? a.whiles.filter(x => x !== sid) : a.whiles.concat(sid); }); return; }
  if ((el = c("[data-act-archive]"))){ const id = el.dataset.actArchive; writeConfig(cf => { cf.activities.find(a => a.id === id).archived = true; }); return; }
  if ((el = c("[data-act-restore]"))){ const id = el.dataset.actRestore; writeConfig(cf => { cf.activities.find(a => a.id === id).archived = false; }); return; }
  if (c("[data-add-act]")){ writeConfig(cf => { cf.activities.push({id:"a"+uid(), name:"New activity", emoji:"⭐", type:"maintenance", whiles:[], project:false, exercise:false, archived:false}); }); return; }
  if ((el = c("[data-sub-tog]"))){ const [id, f] = el.dataset.subTog.split("|"); writeConfig(cf => { const s = cf.subs.find(s => s.id === id); s[f] = !s[f]; }); return; }
  if ((el = c("[data-sub-archive]"))){ const id = el.dataset.subArchive; writeConfig(cf => { cf.subs.find(s => s.id === id).archived = true; }); return; }
  if (c("[data-add-sub]")){ writeConfig(cf => { cf.subs.push({id:"s"+uid(), name:"New option", emoji:"✨", reclaim:true, exercise:false, project:false, archived:false}); }); return; }
  if ((el = c("[data-sch-day]"))){ const [id, d] = el.dataset.schDay.split("|"); const n = Number(d); writeConfig(cf => { const s = cf.schedule.find(s => s.id === id); s.days = (s.days||[]).includes(n) ? s.days.filter(x => x !== n) : (s.days||[]).concat(n).sort(); }); return; }
  if ((el = c("[data-sch-del]"))){ if (el.dataset.armed){ const id = el.dataset.schDel; writeConfig(cf => { cf.schedule = cf.schedule.filter(s => s.id !== id); }); } else { el.dataset.armed = "1"; el.textContent = "Delete?"; } return; }
  if (c("[data-add-sch]")){ writeConfig(cf => { cf.schedule.push({id:"p"+uid(), label:"New block", act:(cf.activities[0]||{}).id||"", days:[], start:"09:00", end:"10:00", from:keyOf(Date.now()), until:""}); }); return; }
  if ((el = c("[data-one-del]"))){ const id = el.dataset.oneDel; writeConfig(cf => { cf.oneoffs = cf.oneoffs.filter(o => o.id !== id); }); return; }
  if (c("[data-add-one]")){ writeConfig(cf => { cf.oneoffs.push({id:"o"+uid(), label:"Drill", act:"drill", date:keyOf(addDays(dayStart(Date.now()),1)), start:"07:00", end:"16:30"}); }); return; }
  if (c("[data-export]")){ exportCsv(); return; }
  if (c("[data-seed]")){ S.config = clone(DEFAULT_CONFIG); S.dueouts = {items:[]}; bump(); render(); persistMany([["config","main",S.config],["dueouts","main",S.dueouts]]); toast("You're set up 💗"); return; }
  if (c("[data-signout]")){ if (sb) sb.auth.signOut(); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target; let f;
  if ((f = t.dataset.actField)){ const [id, k] = f.split("|"); const v = t.value.trim(); if (!v && k !== "type") return render(); writeConfig(cf => { cf.activities.find(a => a.id === id)[k] = v; }); return; }
  if ((f = t.dataset.subField)){ const [id, k] = f.split("|"); const v = t.value.trim(); if (!v) return render(); writeConfig(cf => { cf.subs.find(s => s.id === id)[k] = v; }); return; }
  if ((f = t.dataset.schField)){ const [id, k] = f.split("|"); writeConfig(cf => { cf.schedule.find(s => s.id === id)[k] = t.value; }); return; }
  if ((f = t.dataset.oneField)){ const [id, k] = f.split("|"); writeConfig(cf => { cf.oneoffs.find(o => o.id === id)[k] = t.value; }); return; }
});
let noteTimer = null;
document.addEventListener("input", ev => {
  const t = ev.target; if (!t.dataset.note) return;
  S.drafts[t.dataset.note] = t.value; clearTimeout(noteTimer);
  const id = t.dataset.note, day = t.dataset.day, val = t.value;
  noteTimer = setTimeout(() => { saveNote(id, day, val); delete S.drafts[id]; }, 900);
});
document.addEventListener("focusout", ev => { const t = ev.target; if (t.dataset && t.dataset.note){ clearTimeout(noteTimer); saveNote(t.dataset.note, t.dataset.day, t.value); delete S.drafts[t.dataset.note]; } });
document.addEventListener("change", ev => {
  if (ev.target.id !== "imp-file" || !ev.target.files || !ev.target.files[0]) return;
  const r = new FileReader(); r.onload = () => importCsv(String(r.result)); r.readAsText(ev.target.files[0]); ev.target.value = "";
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "login-form"){ const email = $("li-email").value.trim(), password = $("li-pass").value; $("li-warn").textContent = "";
    sb.auth.signInWithPassword({email, password}).then(({error}) => { if (error) $("li-warn").textContent = "That email and password didn't match. Try again."; }); return; }
  if (ev.target.id === "proj-form"){ const n = $("proj-name").value.trim(); if (!n) return; writeConfig(cf => { cf.projects.push({id:"j"+uid(), name:n, archived:false}); }); toast("Added "+n); }
  if (ev.target.id === "due-form"){ const task = $("due-task").value.trim(); if (!task) return; const project = $("due-proj").value, due = $("due-date").value;
    writeDue(d => { d.items.push({id:"d"+uid(), task, project, due, done:false, doneAt:null}); }); toast("Due out added"); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && $("sheet-root").innerHTML) closeSheet(); });
window.matchMedia("(min-width: 960px)").addEventListener("change", () => { S.scrolledFor = null; render(); });

let toastTimer = null;
function toast(msg){ const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2200); }

/* ---------- boot ---------- */
async function loadAll(){
  const all = []; let from = 0;
  for (;;){ const {data, error} = await sb.from("docs").select("kind,key,data,updated_at").range(from, from+999);
    if (error){ toast("Couldn't load your data. Pull to refresh or try again."); console.error(error); return; }
    all.push(...data); if (data.length < 1000) break; from += 1000; }
  S.config = null; S.dueouts = {items:[]}; S.days = {}; S.stamp = {};
  for (const r of all) applyRow(r);
  S.cfgLoaded = true; S.daysLoaded = true; bump(); render();
}
async function startData(id){
  if (ME === id && S.auth === "in") return;
  ME = id; S.auth = "in"; S.cfgLoaded = false; S.daysLoaded = false; render();
  await loadAll();
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("docs-"+id).on("postgres_changes", {event:"*", schema:"public", table:"docs", filter:"user_id=eq."+id}, p => {
    if (p.eventType === "DELETE"){ loadAll(); return; }
    if (p.new && applyRow(p.new)){ bump(); if (!document.querySelector("#sheet-root .backdrop")) render(); }
  }).subscribe();
}
function stopData(){ ME = null; if (channel){ sb.removeChannel(channel); channel = null; } S.auth = "signedout"; S.config = null; S.days = {}; S.dueouts = {items:[]}; bump(); render(); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ME) loadAll(); });

S.auth = "loading"; render();
(async () => {
  if (!window.supabase || SUPABASE_URL.includes("YOUR-") || SUPABASE_ANON_KEY.includes("YOUR-")){ S.auth = "unconfigured"; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev, session) => {
    // defer: calling Supabase from inside this callback can deadlock
    if (session && session.user) setTimeout(() => startData(session.user.id), 0);
    else if (ev === "SIGNED_OUT") setTimeout(stopData, 0);
  });
  const {data:{session}} = await sb.auth.getSession();
  if (session) startData(session.user.id); else if (!ME){ S.auth = "signedout"; render(); }
})();
})();
